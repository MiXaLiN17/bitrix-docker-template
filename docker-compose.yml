services:
  webserver:
    build:
      context: ./.docker/nginx
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: '${COMPOSE_PROJECT_NAME}_webserver'
    #    restart: always
    volumes:
      - ./src:/var/www/src
      - ${WEB_SERVER_LOG_DIR}:/var/log/nginx
    ports:
      - ${HOST_MACHINE_UNSECURE_HOST_PORT:-80}:80
#      - ${HOST_MACHINE_SECURE_HOST_PORT:-443}:443
    depends_on:
      - app
      - db
    networks:
      - ford-transit
  app:
    container_name: '${COMPOSE_PROJECT_NAME}_app'
    build:
      context: ./.docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        PHP_VERSION: ${PHP_VERSION:-8.4}
    volumes:
      - ./src:/var/www/src
      - ${APP_LOG_DIR}:/var/log/php
    depends_on:
      - db
#    restart: always
    environment:
      PHP_IDE_CONFIG: serverName=docker
    extra_hosts: # Важно!
      - "host.docker.internal:host-gateway"
    networks:
      - ford-transit
  db:
    build:
      context: ./.docker/mysql
    container_name: '${COMPOSE_PROJECT_NAME}_db'
    #    restart: always
    command: mysqld --sql-mode=""
    # ports:
    #   - ${HOST_MACHINE_MYSQL_PORT:-3306}:3306
    volumes:
      # монтируем данные на внешний диск
      - type: volume
        source: ford-transit-ex-db
        target: /var/lib/mysql
      # монтируем логи
      - type: bind
        source: ${MYSQL_LOG_DIR}
        target: /var/log/mysql
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: '${MYSQL_DATABASE}'
      MYSQL_USER: '${MYSQL_USER}'
      MYSQL_PASSWORD: '${MYSQL_PASSWORD}'
#      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    networks:
      - ford-transit

volumes:
  ford-transit-ex-db:
    driver: local
networks:
  ford-transit:
    driver: bridge
