# Директива user не задаётся намеренно: мастер-процесс и так стартует от nginx
# (USER в Dockerfile), а при непривилегированном мастере nginx её игнорирует с warning.
worker_processes auto;
# Каталог отдан пользователю nginx в Dockerfile: /run писать некому, кроме root.
pid /var/run/nginx/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # Main settings
    client_body_buffer_size         4m;
    client_body_timeout             60s;
    client_header_buffer_size       2k;
    client_header_timeout           60s;
    client_max_body_size            20m;
    keepalive_timeout               60s;
    large_client_header_buffers     4   8k;
    reset_timedout_connection       on;
    send_timeout                    60s;
    sendfile                        on;
    server_name_in_redirect         off;
    server_names_hash_bucket_size   512;
    server_names_hash_max_size      512;
    server_tokens                   off;
    tcp_nodelay                     on;
    tcp_nopush                      on;
    types_hash_max_size             2048;
    merge_slashes                   off;

    error_log                       /var/log/nginx/nginx-error.log;
    access_log                      /var/log/nginx/nginx-access.log;

    include                         /etc/nginx/mime.types;
    default_type                    application/octet-stream;

    # Префикс для явных редиректов. $http_host сохраняет порт, с которым пришёл клиент
    # (nginx внутри контейнера слушает 80 и сам бы его потерял). Если заголовка Host нет
    # (HTTP/1.0), префикс пустой — редирект остаётся относительным и nginx достраивает
    # его сам, как делал раньше.
    map $http_host $redirect_prefix {
        ""      "";
        default "$scheme://$http_host";
    }

    # Compression
    gzip                on;
    gzip_static         on;
    gzip_vary           on;
    gzip_comp_level     6;
    gzip_min_length     512;
    gzip_buffers        8 64k;
    gzip_types          text/plain text/css text/javascript text/js text/xml application/json application/javascript application/x-javascript application/xml application/xml+rss application/x-font-ttf image/svg+xml font/opentype;
    gzip_proxied        any;
    gzip_disable        "msie6";
    gzip_http_version   1.0;

    # Log format
    log_format postdata '$remote_addr - $remote_user [$time_local] "$request" $status $bytes_sent "$http_referer" "$http_user_agent" "$request_body"';
    log_format main '$remote_addr - $remote_user [$scheme://$host] [$time_local]  '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    log_format json_combined escape=json
        '{'
            '"remote_addr":"$remote_addr",'
            '"host": "$scheme://$host",'
            '"request":"$request",'
            '"status":$status,'
            '"time_local":"$time_local",'
            '"remote_user":"$remote_user",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"body_bytes_sent":$body_bytes_sent'
        '}';

    # File cache settings
    open_file_cache          max=10000 inactive=30s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   off;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-available/*;
}

