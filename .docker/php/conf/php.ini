[php]
short_open_tag = On
error_log = "/var/log/php/error.log"
; E_WARNING оставляем включённым: именно предупреждения объясняют причину падений.
; Например, imagecreatefromjpeg() на отсутствующем файле пишет warning и возвращает false,
; а прикладной код падает строкой ниже с невнятным TypeError — без warning причину не найти.
; Устаревшие вызовы (E_DEPRECATED) глушим, иначе ядро Битрикса засоряет ими лог.
; На страницу ничего не попадает: display_errors = Off, всё уходит только в error_log.
error_reporting = E_ALL & ~E_DEPRECATED
log_errors = On
cgi.fix_pathinfo = 0
date.timezone = "Europe/Moscow"
max_input_vars = 10000
post_max_size = 1024M
memory_limit = 512M
upload_max_filesize = 64M
max_execution_time = 180
max_input_time = 180
display_errors = Off
display_startup_errors = Off