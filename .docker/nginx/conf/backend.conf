server {
    listen 80;
    server_name _;

    root /var/www/src;

    index index.php index.html;

    add_header X-Content-Type-Options nosniff;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet";

    # Серверный rewrite выполняется до выбора location, поэтому /health нужно
    # исключить из него явно: иначе запрос уходит в urlrewrite.php и отдаёт 404,
    # а HEALTHCHECK контейнера навсегда остаётся unhealthy.
    set $rewrite_to_bitrix "";
    if (!-e $request_filename) {
       set $rewrite_to_bitrix "yes";
    }
    if ($uri = "/health") {
       set $rewrite_to_bitrix "no";
    }
    if ($rewrite_to_bitrix = "yes") {
       rewrite  ^(.*)$  /bitrix/urlrewrite.php last;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # redirect index.php to page without it.
    # $redirect_prefix (задан в nginx.conf) подставляет схему и Host клиента вместе
    # с портом: на относительный путь nginx достраивал Location сам, беря порт,
    # который слушает изнутри контейнера (80), и редирект уводил с :8099 на :80.
    if ($request_uri ~* "^(.*/)index\.php$") {
        return 301 $redirect_prefix$1;
    }

    # Служебные пути закрываем ДО location ~ \.php$: регулярные location проверяются
    # в порядке объявления и побеждает первое совпадение, поэтому ниже по файлу эти
    # правила не срабатывали для .php-файлов внутри закрытых каталогов.
    location ~ (/\.ht|/\.git|/\.gitignore|\.settings\.php|/composer|/bitrix/updates|/bitrix/modules|/bitrix/php_interface|/bitrix/stack_cache|/bitrix/managed_cache|/bitrix/html_pages/\.|local/modules|local/php_interface|/logs/) {
        deny all;
    }

    # Объединённые CSS/JS (настройки главного модуля «Объединять CSS/JS») Битрикс
    # складывает в /bitrix/cache/{css,js}/ и отдаёт как обычную статику. Правило
    # обязано идти ДО общего deny ниже: регулярные location проверяются по порядку,
    # иначе вся вёрстка и скрипты страницы приезжают с 403.
    location ~* ^/bitrix/cache/(css|js)/.+\.(css|js)$ {
        expires 30d;
        add_header Cache-Control public;
        add_header X-Content-Type-Options nosniff;
        access_log off;
        log_not_found off;
    }

    # Disable access for non-static assets (not js and css) in cache location
    location ~* ^/bitrix/cache {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app-upstream;
        fastcgi_index index.php;
        fastcgi_send_timeout 21600;
        fastcgi_read_timeout 21600;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        client_body_buffer_size 128m;
        client_max_body_size 128m;
    }

    location = /favicon.png {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    location ~* ^.+\.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpe?g|avi|zip|gz|bz2?|rar|eot|otf|ttf|woff|woff2)$ {
        log_not_found off;
        access_log off;
        expires 30d;
        add_header Cache-Control public;
        # re-add security header
        add_header X-Content-Type-Options nosniff;
    }

    proxy_connect_timeout       300;
    proxy_send_timeout          300;
    proxy_read_timeout          300;
    send_timeout                300;

    client_max_body_size 200M;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 32k;
}
