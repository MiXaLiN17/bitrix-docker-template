# Конфигурация Sphinx для 1С-Битрикс (модуль "Поиск").
# Структура RT-индекса задана ядром Битрикса — поля и атрибуты менять нельзя.
# Документация: https://dev.1c-bitrix.ru/learning/course/?COURSE_ID=35&LESSON_ID=5935

searchd
{
    # 9312 — нативный протокол, 9306 — SphinxQL, через него Битрикс пишет и читает индекс
    listen              = 9312
    listen              = 9306:mysql41
    log                 = /var/log/sphinxsearch/searchd.log
    query_log           = /var/log/sphinxsearch/query.log
    pid_file            = /var/run/sphinxsearch/searchd.pid
    read_timeout        = 5
    max_children        = 30
    seamless_rotate     = 1
    preopen_indexes     = 1
    unlink_old          = 1
    workers             = threads
    # Бинлог обеспечивает сохранность RT-индекса между перезапусками контейнера
    binlog_path         = /var/lib/sphinxsearch/data/
    binlog_max_log_size = 512M
    binlog_flush        = 2
    rt_flush_period     = 3600
}

indexer
{
    mem_limit           = 256M
    lemmatizer_cache    = 128M
}

common
{
    # Каталог словарей лемматизатора. Нужен, только если ниже заменить morphology
    # на lemmatize_ru_all — тогда в него надо положить ru.pak/en.pak с sphinxsearch.com
    lemmatizer_base     = /etc/sphinxsearch/dicts/
}

# Идентификатор индекса — его же указываем в настройках модуля "Поиск"
index bitrix
{
    type                = rt
    path                = /var/lib/sphinxsearch/data/bitrix
    rt_mem_limit        = 256M

    # stem_enru — стемминг русского и английского, соответствует рекомендациям Битрикса.
    # Кодировка только UTF-8: начиная с 2.2.2 Sphinx не поддерживает windows-1251,
    # а Битрикс с версии 24.0.0 работает только в UTF-8.
    morphology          = stem_enru, soundex
    # dict = keywords включает поиск по префиксу (запросы вида "магаз*") для всех полей
    dict                = keywords
    min_prefix_len      = 2

    rt_field            = title
    rt_field            = body

    rt_attr_uint        = module_id
    rt_attr_string      = module
    rt_attr_uint        = item_id
    rt_attr_string      = item
    rt_attr_uint        = param1_id
    rt_attr_string      = param1
    rt_attr_uint        = param2_id
    rt_attr_string      = param2
    rt_attr_timestamp   = date_change
    rt_attr_timestamp   = date_to
    rt_attr_timestamp   = date_from
    rt_attr_uint        = custom_rank
    rt_attr_multi       = tags
    rt_attr_multi       = right
    rt_attr_multi       = site
    rt_attr_multi       = param
}
