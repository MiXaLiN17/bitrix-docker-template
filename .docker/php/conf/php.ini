[php]
short_open_tag = On
error_log = "/var/log/php/error.log"
error_reporting = E_ALL ^ E_DEPRECATED ^ E_WARNING
log_errors = On
cgi.fix_pathinfo = 0
date.timezone = "Europe/Moscow"
max_input_vars = 10000
post_max_size = 1024M
memory_limit = 512M
upload_max_filesize = 64M
max_execution_time = 180
max_input_time = 180
display_errors = Off
display_startup_errors = Off